<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b7181"/></marker></defs><rect width="1200" height="510" fill="white"/><text x="35" y="43" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#203a4d">时间对齐：动作在区间内执行，触觉在之后观测</text><text x="35" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607888">本图是需要验证的数据契约示例；代码必须依据真实时间戳确认一步关系。</text><path d="M70,180 L1140,180" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><circle cx="110" cy="180" r="6" fill="#078583"/><text x="110" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#203a4d">t+0</text><text x="110" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#078583">T0</text><text x="180" y="176" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#b96824">a0</text><circle cx="250" cy="180" r="6" fill="#078583"/><text x="250" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#203a4d">t+1</text><text x="250" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#078583">T1</text><text x="320" y="176" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#b96824">a1</text><circle cx="390" cy="180" r="6" fill="#078583"/><text x="390" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#203a4d">t+2</text><text x="390" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#078583">T2</text><text x="460" y="176" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#b96824">a2</text><circle cx="530" cy="180" r="6" fill="#078583"/><text x="530" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#203a4d">t+3</text><text x="530" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#078583">T3</text><text x="600" y="176" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#b96824">a3</text><circle cx="670" cy="180" r="6" fill="#078583"/><text x="670" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#203a4d">t+4</text><text x="670" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#078583">T4</text><text x="740" y="176" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#b96824">a4</text><circle cx="810" cy="180" r="6" fill="#078583"/><text x="810" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#203a4d">t+5</text><text x="810" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#078583">T5</text><text x="880" y="176" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#b96824">a5</text><circle cx="950" cy="180" r="6" fill="#078583"/><text x="950" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#203a4d">t+6</text><text x="950" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#078583">T6</text><text x="1020" y="176" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#b96824">a6</text><circle cx="1090" cy="180" r="6" fill="#078583"/><text x="1090" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#203a4d">t+7</text><text x="1090" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#078583">T7</text><rect x="35" y="275" width="535" height="145" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="51" y="308" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">一次决策的输入</text><text x="51" y="341" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">历史触觉到 t 为止；当前状态 S0</text><text x="51" y="369" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">候选动作 a0 作用于 t → t+1</text><text x="51" y="397" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">T1 是执行后需要预测的触觉</text><rect x="605" y="275" width="560" height="145" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="621" y="308" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">对齐与频率</text><text x="621" y="341" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">20Hz 时相邻观测相隔 50ms</text><text x="621" y="369" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">视频可稀疏采样，触觉保留自己的时轴</text><text x="621" y="397" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">传感延迟、缺帧和动作执行延迟都要记录</text></svg>