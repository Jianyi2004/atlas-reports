<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b7181"/></marker></defs><rect width="1200" height="470" fill="white"/><text x="35" y="43" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#203a4d">测量语义不能靠“都画成图片”来统一</text><text x="35" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607888">同样是二维网格，每个数的单位和物理含义可能完全不同</text><rect x="35" y="115" width="245" height="205" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="51" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">光学触觉</text><text x="51" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">输入：RGB 图像</text><text x="51" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">反映：弹性体成像</text><text x="51" y="237" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">受照明、材料影响</text><text x="51" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">适合视觉式编码器</text><rect x="330" y="115" width="245" height="205" rx="12" fill="#b96824" fill-opacity=".06" stroke="#b96824" stroke-width="1.7"/><text x="346" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#b96824">压力 / 三维力</text><text x="346" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">输入：taxel 数值</text><text x="346" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">需单位、方向与标定</text><text x="346" y="237" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">保留幅值与接触面积</text><text x="346" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">适合数值/场编码</text><rect x="625" y="115" width="245" height="205" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="641" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">本地 Sharpa</text><text x="641" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">输入：距离 + 接触</text><text x="641" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">距离是 raycast 几何</text><text x="641" y="237" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">不能直接叫作力</text><text x="641" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">先预测接触与距离</text><rect x="920" y="115" width="245" height="205" rx="12" fill="#7553a4" fill-opacity=".06" stroke="#7553a4" stroke-width="1.7"/><text x="936" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#7553a4">腕部 F/T</text><text x="936" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">输入：六轴 wrench</text><text x="936" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">反映：腕部合成作用</text><text x="936" y="237" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">不知每指哪里接触</text><text x="936" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">适合时序编码</text><rect x="35" y="353" width="1130" height="80" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="51" y="386" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">跨传感器：共享接触事件与解剖区域，保留不同测量的专用头</text></svg>