<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53697b"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="35" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#183046" text-anchor="start" font-weight="700">
<tspan x="28" dy="0">执行异步与去噪异步是两个独立的开关</tspan>
</text>
<text x="25" y="85" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="19" fill="#183046" text-anchor="start" font-weight="700">
<tspan x="25" dy="0">同步执行</tspan>
</text>
<text x="25" y="206" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="19" fill="#183046" text-anchor="start" font-weight="700">
<tspan x="25" dy="0">异步预取</tspan>
</text>
