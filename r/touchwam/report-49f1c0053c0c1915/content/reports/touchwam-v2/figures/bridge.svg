<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" role="img" aria-labelledby="title desc">
<title id="title">单个触觉交互层的执行顺序</title><desc id="desc">触觉首先读历史与未来触觉，再读视觉动作，再用独立的注意力和零初始化残差门控写回。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#506780"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="48.0" fill="#172c42" font-size="28" text-anchor="start" font-weight="700">一个交互层内部：谁提问，谁提供信息？</text><text x="40" y="82.0" fill="#536b7d" font-size="19" text-anchor="start" font-weight="400">Q = 当前要更新的 token；K/V = 可读取的 memory。不同方向有各自的投影参数。</text><rect x="80" y="112" width="1080" height="118" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="100" y="145.0" fill="#172c42" font-size="22" text-anchor="start" font-weight="650">① 运行原 VA 层</text><text x="100" y="177.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">原视觉 / 动作联合 attention → 得到本层 V 和 A</text><text x="100" y="208.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">原 VA softmax 保持原样；本步尚未插入触觉 K/V。</text><polyline points="620,230 620,259" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="80" y="261" width="1080" height="118" rx="14" fill="#e3f4ed" stroke="#aac0df" stroke-width="1.5"/><text x="100" y="294.0" fill="#172c42" font-size="22" text-anchor="start" font-weight="650">② 未来触觉读触觉上下文</text><text x="100" y="326.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">Q = AdaLN(T)；K/V = [干净历史 H, AdaLN(T)]</text><text x="100" y="357.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">只更新未来 T；H 是只读 memory。未来 token 可互相读取。</text><polyline points="620,379 620,408" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="80" y="410" width="1080" height="118" rx="14" fill="#e3f4ed" stroke="#aac0df" stroke-width="1.5"/><text x="100" y="443.0" fill="#172c42" font-size="22" text-anchor="start" font-weight="650">③ 未来触觉读 V/A，再执行 FFN</text><text x="100" y="475.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">Q = LN(T)；K/V = [投影(V), 投影(A)]</text><text x="100" y="506.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">T 加上 attention 残差，再加上经 AdaLN 调制的 FFN 输出。</text><polyline points="620,528 620,557" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="80" y="559" width="1080" height="118" rx="14" fill="#fff6df" stroke="#aac0df" stroke-width="1.5"/><text x="100" y="592.0" fill="#172c42" font-size="22" text-anchor="start" font-weight="650">④ V/A 分别读触觉并写回</text><text x="100" y="624.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">Q = LN(V) 或 LN(A)；K/V = [H, 更新后的 T]</text><text x="100" y="655.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">V ← V + tanh(gV)·ΔV；A ← A + tanh(gA)·ΔA。</text><text x="80" y="754.0" fill="#536b7d" font-size="20" text-anchor="start" font-weight="400">每个交互块各有两个标量 gate，初始为 0；ΔV 在干净视觉首帧的位置强制为 0。</text></g></svg>