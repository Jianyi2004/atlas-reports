<text x="35" y="423" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="19" fill="#183046" text-anchor="start" font-weight="700">
<tspan x="35" dy="0">每个流的投影参数仍然独立；拼接的是token位置，不是把1024和3072硬拼成4096。</tspan>
</text>
<text x="35" y="467" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#53697b" text-anchor="start" font-weight="400">
