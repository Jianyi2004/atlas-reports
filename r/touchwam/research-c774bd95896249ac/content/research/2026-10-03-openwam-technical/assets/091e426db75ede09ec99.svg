</text>
<rect x="373" y="292" width="294" height="79" rx="12" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="1.6"/>
<text x="520.0" y="323.70000000000005" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="20" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="520.0" dy="0">各自 WQ / WK / WV</tspan>
<tspan x="520.0" dy="29.0">1024 → 3072</tspan>
</text>
<path d="M295,123 L373,123" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M295,331 L373,331" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="749" y="160" width="340" height="135" rx="12" fill="#0f8b8d" fill-opacity=".07" stroke="#0f8b8d" stroke-width="1.6"/>
<text x="919.0" y="205.29999999999998" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="20" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="919.0" dy="0">共同几何：24 头 × 128维</tspan>
<tspan x="919.0" dy="29.0">沿 token 轴拼接</tspan>
