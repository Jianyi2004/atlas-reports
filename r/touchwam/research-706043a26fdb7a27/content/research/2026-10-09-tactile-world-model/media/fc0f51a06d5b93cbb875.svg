<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b7181"/></marker></defs><rect width="1200" height="670" fill="white"/><text x="35" y="43" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#203a4d">五种建模任务：输出什么，决定能回答什么</text><text x="35" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607888">A = 控制动作，V = 视觉，T = 触觉；所有历史仅包含决策时已知信息</text><rect x="35" y="105" width="305" height="88" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="51" y="138" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">触觉条件策略</text><text x="365" y="135" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">历史 V / T / 状态 → 未来 A</text><text x="365" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#203a4d">现在感觉到什么，应该怎样行动？</text><rect x="35" y="212" width="305" height="88" rx="12" fill="#7553a4" fill-opacity=".06" stroke="#7553a4" stroke-width="1.7"/><text x="51" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#7553a4">触觉条件视频预测</text><text x="365" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#7553a4">历史 V / T / 手姿 → 未来 V</text><text x="365" y="276" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#203a4d">触觉能否帮助看清未来运动？</text><rect x="35" y="319" width="305" height="88" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="51" y="352" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">历史条件触觉预测</text><text x="365" y="349" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">历史 T / 视觉 / 力 → 未来 T</text><text x="365" y="383" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#203a4d">按学到的行为规律，接触将怎样发展？</text><rect x="35" y="426" width="305" height="88" rx="12" fill="#b96824" fill-opacity=".06" stroke="#b96824" stroke-width="1.7"/><text x="51" y="459" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#b96824">动作条件世界模型</text><text x="365" y="456" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#b96824">历史 + 指定未来 A → 未来 V / T</text><text x="365" y="490" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#203a4d">如果我执行这个候选动作，会发生什么？</text><rect x="35" y="533" width="305" height="88" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="51" y="566" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">世界—动作联合生成</text><text x="365" y="563" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">历史 → 联合生成未来 V / T / A</text><text x="365" y="597" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#203a4d">共同生成一致的动作和接触未来</text></svg>