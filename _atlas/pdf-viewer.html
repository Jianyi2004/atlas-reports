<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 阅读器</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0ea;color:#365144;font:13px/1.6 system-ui,sans-serif}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border-bottom:1px solid #d9e2d4;background:#fcfdf9;box-shadow:0 2px 8px #25443208}button,a,input{font:inherit;color:inherit}button,a{border:1px solid #d9e3d1;border-radius:5px;background:white;padding:5px 10px;text-decoration:none;cursor:pointer}button:disabled{opacity:.4;cursor:default}input{width:48px;border:1px solid #dbe3d6;border-radius:4px;padding:5px;text-align:center}#pages{max-width:1250px;margin:20px auto;padding:0 15px}.pdf-page{margin:18px auto;position:relative;max-width:none;background:white;box-shadow:0 3px 14px #1c372316;overflow:hidden}.pdf-page canvas{display:block;width:100%;height:100%}.placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#9eac94}#message{text-align:center;padding:50px 20px;color:#829573}.spacer{width:12px}#zoom-label{min-width:42px;text-align:center;font-size:12px}button:focus-visible,a:focus-visible{outline:2px solid #719869;outline-offset:2px}@media(max-width:550px){header{gap:5px;padding:8px 6px;font-size:11px}.spacer{display:none}button,a{padding:5px 7px}input{width:38px}#pages{padding:0 8px;margin-top:10px}}
</style></head><body><header><button id="prev" aria-label="上一页" disabled>←</button><input id="page-number" aria-label="页码" type="number" value="1" min="1"><span id="page-count">/ —</span><button id="next" aria-label="下一页" disabled>→</button><span class="spacer"></span><button id="minus" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="plus" aria-label="放大">＋</button><a id="download" download>下载</a><a id="original" target="_blank" rel="noopener">原文件 ↗</a></header><div id="message" role="status">正在加载 PDF…</div><main id="pages"></main><script type="module" src="./pdf-viewer.js"></script></body></html>
