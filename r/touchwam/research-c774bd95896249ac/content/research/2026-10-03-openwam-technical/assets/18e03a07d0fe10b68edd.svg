<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53697b"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="35" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#183046" text-anchor="start" font-weight="700">
<tspan x="28" dy="0">rot6d 解码：把两条预测方向整理成一个正交坐标架</tspan>
</text>
<rect x="25" y="83" width="1056" height="62" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb" stroke-width="1.6"/>
<text x="553.0" y="120.93" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="21" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="553.0" dy="0">输入六个数：[u₁,u₂,u₃,v₁,v₂,v₃]；u和v分别作为两列方向的候选</tspan>
</text>
<rect x="25" y="213" width="295" height="128" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb" stroke-width="1.6"/>
<text x="172.5" y="255.91" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="19" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="172.5" dy="0">① 归一化第一方向</tspan>
<tspan x="172.5" dy="27.55">b₁ = u / ‖u‖</tspan>
<tspan x="172.5" dy="27.55">例：u=(2,0,0) → (1,0,0)</tspan>
</text>
<rect x="409" y="213" width="295" height="128" rx="12" fill="#0f8b8d" fill-opacity=".07" stroke="#0f8b8d" stroke-width="1.6"/>
<text x="556.5" y="255.91" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="19" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="556.5" dy="0">② 去掉沿 b₁ 的投影</tspan>
<tspan x="556.5" dy="27.55">v⊥ = v − (b₁ᵀv)b₁</tspan>
<tspan x="556.5" dy="27.55">b₂ = v⊥ / ‖v⊥‖</tspan>
</text>
<rect x="792" y="213" width="295" height="128" rx="12" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="1.6"/>
<text x="939.5" y="255.91" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="19" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="939.5" dy="0">③ 用叉积补第三轴</tspan>
<tspan x="939.5" dy="27.55">b₃ = b₁ × b₂</tspan>
<tspan x="939.5" dy="27.55">R = [b₁  b₂  b₃]</tspan>
</text>
<path d="M320,278 L409,278" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M704,278 L792,278" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="25" y="405" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="start" font-weight="400">
<tspan x="25" dy="0">例：v=(1,3,0) → v⊥=(0,3,0) → b₂=(0,1,0)，于是 b₃=(0,0,1)，得到单位旋转。</tspan>
</text>
<text x="25" y="450" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#53697b" text-anchor="start" font-weight="400">
<tspan x="25" dy="0">六维表示提供连续的方向参数；退化输入（零向量或两列共线）仍需数值保护。</tspan>
</text>
<text x="25" y="493" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#c86c15" text-anchor="start" font-weight="400">
<tspan x="25" dy="0">源码编码按“矩阵第一列，然后第二列”拼接，不能用默认按行 flatten 偷换顺序。</tspan>
</text>
</svg>