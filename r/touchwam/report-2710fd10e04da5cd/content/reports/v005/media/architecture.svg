<text x="1020" y="925" class="label">+2,800,806 new parameters</text><text x="1020" y="957" class="body">Encoder + projection + 6 adapters</text><text x="1020" y="989" class="body">Learned through video / action losses</text><text x="1020" y="1021" class="body">Tactile input stays an observed condition</text>
<rect x="30" y="1090" width="1440" height="117" rx="10" fill="#f7f8fa" stroke="#a9b9c5" stroke-width="1.4"/>
<text x="46" y="1119" class="label">Training mode and checkpoint compatibility</text>
<text x="46" y="1146" class="body">TRAINABLE: video DiT, action DiT, state projection, tactile encoder/projection, tactile K/V increments and gates.</text>
<text x="46" y="1170" class="body">FROZEN: VAE and text preprocessing encoders. Original pretrained tensor names/shapes remain compatible.</text>
<text x="46" y="1194" class="body">TouchWAM V1: original video/action generation with an added tactile condition branch.</text>
