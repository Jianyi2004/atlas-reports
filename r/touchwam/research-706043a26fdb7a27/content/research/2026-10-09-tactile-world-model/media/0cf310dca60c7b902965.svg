<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b7181"/></marker></defs><rect width="1200" height="750" fill="white"/><text x="35" y="43" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#203a4d">候选 V2-J：视频、未来触觉、动作三流联合生成</text><text x="35" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607888">这是本报告提出的实现方案，尚未加入工作区模型。</text><rect x="35" y="112" width="1130" height="90" rx="12" fill="#7553a4" fill-opacity=".06" stroke="#7553a4" stroke-width="1.7"/><text x="51" y="145" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#7553a4">干净条件：当前图像 / 本体状态 / 指令 / 实测触觉历史</text><text x="51" y="178" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">历史触觉只读；未来真实触觉仅在训练中作为监督</text><rect x="35" y="277" width="310" height="125" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="51" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">视频流 V</text><text x="51" y="343" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">复用 α 视频权重</text><text x="51" y="371" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">360 token，宽 3072</text><path d="M190,205 L190,275" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="445" y="277" width="310" height="125" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="461" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">触觉未来流 T</text><text x="461" y="343" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">新增 TactileDiT</text><text x="461" y="371" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">示例 80 token，宽 512</text><path d="M600,205 L600,275" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="855" y="277" width="310" height="125" rx="12" fill="#b96824" fill-opacity=".06" stroke="#b96824" stroke-width="1.7"/><text x="871" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#b96824">动作流 A</text><text x="871" y="343" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">复用 α 动作权重</text><text x="871" y="371" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">32 token，宽 1024</text><path d="M1010,205 L1010,275" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="35" y="457" width="1130" height="83" rx="12" fill="#7553a4" fill-opacity=".06" stroke="#7553a4" stroke-width="1.7"/><text x="51" y="490" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#7553a4">桥接层：各自投影 Q/K/V → 受 mask 控制的共同注意力 → 映射回各自宽度</text><path d="M190,404 L190,455" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M190,542 L190,590" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M600,404 L600,455" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M600,542 L600,590" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M1010,404 L1010,455" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M1010,542 L1010,590" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="35" y="592" width="310" height="105" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="51" y="625" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">视频速度 / 未来视频</text><text x="51" y="658" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">可省 RGB 解码，保留 latent</text><rect x="445" y="592" width="310" height="105" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="461" y="625" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">触觉速度 / 未来接触</text><text x="461" y="658" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">冻结 codec 解码接触和距离</text><rect x="855" y="592" width="310" height="105" rx="12" fill="#b96824" fill-opacity=".06" stroke="#b96824" stroke-width="1.7"/><text x="871" y="625" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#b96824">动作速度 / 可执行动作</text><text x="871" y="658" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">执行短前缀，再采集反馈</text><text x="35" y="734" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#607888">这里的“速度”是 flow matching 的去噪速度；不是手指、物体或相机的物理运动速度。</text></svg>