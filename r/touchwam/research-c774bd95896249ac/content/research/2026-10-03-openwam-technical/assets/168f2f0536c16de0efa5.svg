<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53697b"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="35" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#183046" text-anchor="start" font-weight="700">
<tspan x="28" dy="0">监督与梯度：没有动作标签，动作分支也可能参与计算</tspan>
</text>
<rect x="45" y="90" width="350" height="95" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb" stroke-width="1.6"/>
<text x="220.0" y="129.7" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="20" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="220.0" dy="0">视频 latent → 视频分支</tspan>
<tspan x="220.0" dy="29.0">输出视频速度预测</tspan>
</text>
<rect x="725" y="90" width="350" height="95" rx="12" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="1.6"/>
<text x="900.0" y="129.7" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="20" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="900.0" dy="0">动作噪声 → 动作分支</tspan>
<tspan x="900.0" dy="29.0">输出动作速度预测</tspan>
</text>
<path d="M395,133 L725,133" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="560.0" y="123.0" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="15" fill="#53697b" text-anchor="middle" font-weight="400">
<tspan x="560.0" dy="0">mutual：中间特征双向交互</tspan>
</text>
<rect x="45" y="265" width="350" height="86" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb" stroke-width="1.6"/>
<text x="220.0" y="300.20000000000005" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="20" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="220.0" dy="0">视频损失 Lᵥ</tspan>
<tspan x="220.0" dy="29.0">人类视频也可计算</tspan>
</text>
<rect x="725" y="265" width="350" height="86" rx="12" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="1.6"/>
<text x="900.0" y="300.20000000000005" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="20" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="900.0" dy="0">动作损失 Lₐ</tspan>
<tspan x="900.0" dy="29.0">无动作标签时 mask → 0</tspan>
</text>
<path d="M220,185 L220,265" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M900,185 L900,265" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="429" y="247" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#0f8b8d" text-anchor="start" font-weight="400">
<tspan x="429" dy="0">Lᵥ 的反向梯度</tspan>
<tspan x="429" dy="26.099999999999998">可沿耦合边进入</tspan>
<tspan x="429" dy="26.099999999999998">动作分支的部分参数</tspan>
</text>
<path d="M220,185 L725,158" stroke="#0f8b8d" stroke-width="1.5" fill="none" stroke-dasharray="6 5"/>
<text x="35" y="413" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="start" font-weight="700">
<tspan x="35" dy="0">loss mask：决定哪里算监督误差。attention mask：决定某个 token 能读取哪些 token。</tspan>
</text>
<text x="35" y="455" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="16" fill="#53697b" text-anchor="start" font-weight="400">
<tspan x="35" dy="0">这张图描述当前代码的可微计算路径；不能由此推断每个动作参数在每一步都一定有非零梯度。</tspan>
</text>
</svg>