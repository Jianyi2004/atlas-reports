<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b7181"/></marker></defs><rect width="1200" height="665" fill="white"/><text x="35" y="43" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#203a4d">历史触觉 token 与未来触觉 token 是两组不同对象</text><text x="35" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607888">示例配置：10 指，20 Hz；未来 codec 的宽度和 token 数属于本报告候选设计</text><rect x="35" y="115" width="520" height="140" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="51" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">已观察历史：4 帧 × 10 指</text><text x="51" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">输入 [B,4,10,2,32,32]</text><text x="51" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">每指两通道：距离、接触；另有有效性 mask</text><rect x="645" y="115" width="520" height="140" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="661" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">训练未来目标：8 帧 × 10 指</text><text x="661" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">输入 [B,8,10,2,32,32]</text><text x="661" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">未来真值只用于训练与离线评测</text><path d="M295,256 L295,305" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M905,256 L905,305" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="35" y="310" width="520" height="130" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="51" y="343" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">共享局部 CNN + 区域汇总</text><text x="51" y="376" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">加手 / 指 / 时间身份；历史可因果聚合</text><text x="51" y="404" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">作为干净、只读的当前条件</text><rect x="645" y="310" width="520" height="130" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="661" y="343" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">逐帧 codec：每指 K 个 latent</text><text x="661" y="376" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">K=1 → 80 个未来 token</text><text x="661" y="404" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">K=4 → 320 个未来 token</text><path d="M295,442 L295,490" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M905,442 L905,490" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="35" y="495" width="520" height="110" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="51" y="528" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">历史特征送入条件注意力</text><text x="51" y="561" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">部署来自真实传感器，不被去噪更新</text><rect x="645" y="495" width="520" height="110" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="661" y="528" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">未来 latent 是预测对象</text><text x="661" y="561" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">训练加噪；部署从噪声生成</text></svg>