<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="title desc">
<title id="title">TouchWAM V1 — current joint fine-tuning architecture</title>
<desc id="desc">OpenWAM video and action streams retain their joint attention. A new causal tactile encoder produces forty tokens. Six action layers receive separately gated tactile cross-attention. The video and action backbones and tactile modules are jointly trained; the VAE and text encoder are frozen.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#566877"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#247557"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#203443}.title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#546777}.label{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.line{fill:none;stroke:#566877;stroke-width:2.3;marker-end:url(#arrow)}.touchline{fill:none;stroke:#247557;stroke-width:2.7;marker-end:url(#green)}.panel{fill:#f6f8fa;stroke:#d5dfe6;stroke-width:1.5}</style>
