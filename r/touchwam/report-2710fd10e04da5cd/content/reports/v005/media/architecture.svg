<text x="526" y="355" class="body">Noisy 32-step action chunk</text>
<text x="526" y="379" class="body">80 slots / 58 active dimensions</text>
<text x="526" y="403" class="body">Two arm EEF poses + finger joints</text>
<rect x="55" y="463" width="410" height="92" rx="10" fill="#eaf3fc" stroke="#7aa9d1" stroke-width="1.4"/>
<text x="71" y="492" class="label">Video DiT · width 3072</text>
<text x="71" y="519" class="body">Pretrained weights · jointly fine-tuned</text>
<rect x="510" y="463" width="420" height="92" rx="10" fill="#f1edfb" stroke="#ab94cf" stroke-width="1.4"/>
<text x="526" y="492" class="label">Action DiT · width 1024</text>
<text x="526" y="519" class="body">Pretrained weights · jointly fine-tuned</text>
