<text x="71" y="618" class="label">Joint video–action attention · retained in all 30 layers</text>
<text x="71" y="645" class="body">Separate projections → concatenate Q/K/V → joint attention → split streams</text>
<text x="71" y="669" class="body">Mutual interaction · clean video observation prefix · original residual / AdaLN</text>
