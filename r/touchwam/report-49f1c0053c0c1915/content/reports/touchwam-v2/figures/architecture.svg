<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" role="img" aria-labelledby="title desc">
<title id="title">TouchWAM V2 三分支架构</title><desc id="desc">保留 Alpha 视觉动作联合 attention，在六个层位置加入紧凑触觉模块，通过独立 attention 和零初始化门控双向交互。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#506780"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="48.0" fill="#172c42" font-size="28" text-anchor="start" font-weight="700">TouchWAM V2 · 复用 Alpha，新增未来触觉生成</text><text x="40" y="82.0" fill="#536b7d" font-size="18" text-anchor="start" font-weight="400">蓝色：原视觉 / 动作参数；绿色：新增 touch_v2.*；箭头表示信息流，不表示共享权重。</text><rect x="40" y="118" width="310" height="110" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="60" y="151.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">视觉输入</text><text x="60" y="183.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">VAE 编码当前图像为干净条件</text><text x="60" y="210.9" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">与加噪未来潜变量一起分块</text><rect x="390" y="118" width="310" height="110" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="410" y="151.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">动作输入</text><text x="410" y="183.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">加噪未来动作</text><text x="410" y="210.9" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">语言 / 本体状态作为条件</text><rect x="800" y="118" width="190" height="110" rx="14" fill="#e3f4ed" stroke="#9fcbb6" stroke-width="1.5"/><text x="820" y="151.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="650">历史触觉</text><text x="820" y="183.0" fill="#172c42" font-size="16" text-anchor="start" font-weight="400">4 帧 · 160 tokens</text><text x="820" y="207.8" fill="#172c42" font-size="16" text-anchor="start" font-weight="400">因果编码，保持只读</text><rect x="1010" y="118" width="190" height="110" rx="14" fill="#e3f4ed" stroke="#9fcbb6" stroke-width="1.5"/><text x="1030" y="151.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="650">加噪未来触觉</text><text x="1030" y="183.0" fill="#172c42" font-size="16" text-anchor="start" font-weight="400">8 帧 · 320 tokens</text><text x="1030" y="207.8" fill="#172c42" font-size="16" text-anchor="start" font-weight="400">独立噪声时间 σT</text><polyline points="195,228 195,295" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="545,228 545,295" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="890,228 890,295" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="1105,228 1105,295" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="290" width="660" height="290" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="60" y="323.0" fill="#172c42" font-size="22" text-anchor="start" font-weight="650">原 OpenWAM Alpha 路径</text><text x="60" y="355.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">保留原参数路径与 V/A 联合 attention 的 softmax</text><rect x="65" y="384" width="270" height="115" rx="14" fill="#fff" stroke="#aac0df" stroke-width="1.5"/><text x="85" y="417.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">视觉 DiT</text><text x="85" y="449.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">30 层 · 宽度 3072</text><text x="85" y="476.9" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">读取视觉 / 动作信息</text><rect x="405" y="384" width="270" height="115" rx="14" fill="#fff" stroke="#aac0df" stroke-width="1.5"/><text x="425" y="417.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">动作 DiT</text><text x="425" y="449.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">30 层 · 宽度 1024</text><text x="425" y="476.9" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">Alpha80 / 有效58维</text><polyline points="335,426 405,426" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="405,465 335,465" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><text x="70" y="552.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">先完成每个原 VA 层，再在选定层执行触觉交互。</text><rect x="800" y="290" width="400" height="290" rx="14" fill="#e3f4ed" stroke="#9fcbb6" stroke-width="1.5"/><text x="820" y="323.0" fill="#172c42" font-size="21" text-anchor="start" font-weight="650">新增触觉 Transformer</text><text x="820" y="355.0" fill="#172c42" font-size="19" text-anchor="start" font-weight="400">6 层 · 宽度 256 · 8 heads</text><text x="820" y="384.45" fill="#172c42" font-size="19" text-anchor="start" font-weight="400">FFN 256 → 1024 → 256</text><text x="820" y="413.9" fill="#172c42" font-size="19" text-anchor="start" font-weight="400"></text><text x="820" y="443.35" fill="#172c42" font-size="19" text-anchor="start" font-weight="400">未来触觉读取：历史 + 未来触觉</text><text x="820" y="472.8" fill="#172c42" font-size="19" text-anchor="start" font-weight="400">再读取当前层的 V/A 特征</text><text x="820" y="502.25" fill="#172c42" font-size="19" text-anchor="start" font-weight="400">σT 经 AdaLN 调节触觉块</text><polyline points="700,369 800,369" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><text x="750" y="349.0" fill="#172c42" font-size="16" text-anchor="middle" font-weight="400">读取</text><polyline points="800,520 700,520" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><text x="750" y="498.0" fill="#172c42" font-size="16" text-anchor="middle" font-weight="400">门控写回</text><rect x="40" y="625" width="310" height="100" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="60" y="658.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">视觉速度场</text><text x="60" y="690.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">联合去噪 → 未来视频</text><rect x="390" y="625" width="310" height="100" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="410" y="658.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">动作速度场</text><text x="410" y="690.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">联合去噪 → 动作序列</text><rect x="800" y="625" width="400" height="100" rx="14" fill="#e3f4ed" stroke="#9fcbb6" stroke-width="1.5"/><text x="820" y="658.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">触觉速度场 · 每 patch 512 维</text><text x="820" y="690.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">联合去噪 → 距离图 / 接触概率图</text><polyline points="195,580 195,625" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="545,580 545,625" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="1000,580 1000,625" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="770" width="1160" height="110" rx="14" fill="#fff6df" stroke="#e7cd88" stroke-width="1.5"/><text x="60" y="803.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">交互位置：[4, 9, 14, 19, 24, 29]（零基编号）</text><text x="60" y="835.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">触觉写回使用独立 cross-attention + tanh(gate) 残差；gate 初始为 0。</text><text x="60" y="862.9" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">视觉干净首帧不接受触觉写回；历史不读取未来；触觉 K/V 不加入原 VA softmax。</text></g></svg>