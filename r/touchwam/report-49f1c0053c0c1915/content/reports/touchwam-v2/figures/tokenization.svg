<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" role="img" aria-labelledby="title desc">
<title id="title">触觉地图到 token 的形状变换</title><desc id="desc">4帧历史和8帧未来分别得到160和320个512维patch向量，投影到256维；二者通过时间槽位区分。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#506780"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="49.0" fill="#172c42" font-size="28" text-anchor="start" font-weight="700">从触觉地图到 token：一个 token 是一个局部 patch</text><text x="40" y="82.0" fill="#536b7d" font-size="19" text-anchor="start" font-weight="400">B = batch；10 = 左右手十个指尖；2 通道 = 距离 + 接触。</text><rect x="40" y="120" width="550" height="105" rx="14" fill="#e3f4ed" stroke="#9fcbb6" stroke-width="1.5"/><text x="60" y="153.0" fill="#172c42" font-size="23" text-anchor="start" font-weight="650">干净历史：t−3, t−2, t−1, t</text><text x="60" y="185.0" fill="#172c42" font-size="21" text-anchor="start" font-weight="400">[B, 4, 10, 2, 32, 32]</text><rect x="650" y="120" width="550" height="105" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="670" y="153.0" fill="#172c42" font-size="23" text-anchor="start" font-weight="650">未来目标：t+2, t+4, …, t+16</text><text x="670" y="185.0" fill="#172c42" font-size="21" text-anchor="start" font-weight="400">[B, 8, 10, 2, 32, 32]</text><polyline points="315,225 315,267" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="925,225 925,267" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="267" width="1160" height="122" rx="14" fill="#fff6df" stroke="#e7cd88" stroke-width="1.5"/><text x="60" y="300.0" fill="#172c42" font-size="22" text-anchor="start" font-weight="650">固定 codec：先归一化，再排列 patch</text><text x="60" y="332.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">距离 / 0.015m → 裁剪 [−1,1]；无接触距离置 0；接触 0/1 → −1/+1。</text><text x="60" y="363.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">每张双通道 32×32 图切成 2×2 个 16×16 patch；每个 patch 展平为 2×16×16 = 512 维。</text><polyline points="315,389 315,433" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="925,389 925,433" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="433" width="550" height="112" rx="14" fill="#e3f4ed" stroke="#9fcbb6" stroke-width="1.5"/><text x="60" y="466.0" fill="#172c42" font-size="22" text-anchor="start" font-weight="650">历史 patch 向量</text><text x="60" y="498.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">4 帧 × 10 指尖 × 4 patch = 160 tokens</text><text x="60" y="529.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">[B, 160, 512]</text><rect x="650" y="433" width="550" height="112" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="670" y="466.0" fill="#172c42" font-size="22" text-anchor="start" font-weight="650">未来 patch 向量</text><text x="670" y="498.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">8 帧 × 10 指尖 × 4 patch = 320 tokens</text><text x="670" y="529.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">[B, 320, 512] → flow 加噪</text><polyline points="315,545 315,590" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="925,545 925,590" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="590" width="550" height="134" rx="14" fill="#e3f4ed" stroke="#9fcbb6" stroke-width="1.5"/><text x="60" y="623.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">共享可训练投影 + 位置 embedding</text><text x="60" y="655.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">Linear 512→256 → SiLU → Linear 256→256</text><text x="60" y="682.9" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">加入：指尖 ID + patch ID + 帧槽位 ID</text><text x="60" y="710.8" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">2 层因果历史编码器 → [B,160,256]</text><rect x="650" y="590" width="550" height="134" rx="14" fill="#eaf1fd" stroke="#aac0df" stroke-width="1.5"/><text x="670" y="623.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="650">共享可训练投影 + 位置 embedding</text><text x="670" y="655.0" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">Linear 512→256 → SiLU → Linear 256→256</text><text x="670" y="682.9" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">未来槽位与历史槽位不同；输入为加噪 patch</text><text x="670" y="710.8" fill="#172c42" font-size="18" text-anchor="start" font-weight="400">进入 6 层触觉分支 → [B,320,256]</text><polyline points="925,724 925,770" fill="none" stroke="#506780" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="650" y="770" width="550" height="112" rx="14" fill="#e3f4ed" stroke="#9fcbb6" stroke-width="1.5"/><text x="670" y="803.0" fill="#172c42" font-size="21" text-anchor="start" font-weight="650">输出头与恢复地图</text><text x="670" y="835.0" fill="#172c42" font-size="19" text-anchor="start" font-weight="400">LayerNorm + Linear 256→512 → 速度场</text><text x="670" y="864.45" fill="#172c42" font-size="19" text-anchor="start" font-weight="400">Euler 去噪后 unpatchify → 8 帧未来地图</text><text x="40" y="799.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">时间对齐由数据偏移定义：</text><text x="40" y="830.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">20 Hz × 每 2 帧取样 → 间隔 0.1 秒。</text><text x="40" y="861.0" fill="#172c42" font-size="20" text-anchor="start" font-weight="400">触觉帧不必匹配视觉 VAE 的压缩帧数。</text><text x="40" y="941.0" fill="#536b7d" font-size="19" text-anchor="start" font-weight="400">固定 patch 排列可逆；归一化裁剪有信息损失。可训练的 512→256 投影不是可逆 codec，也不是触觉 VAE。</text></g></svg>