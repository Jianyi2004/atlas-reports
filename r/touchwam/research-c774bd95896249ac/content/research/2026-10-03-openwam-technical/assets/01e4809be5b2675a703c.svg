<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53697b"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="35" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#183046" text-anchor="start" font-weight="700">
<tspan x="28" dy="0">一行注意力的完整计算：匹配分数 → 概率 → 内容加权</tspan>
</text>
<rect x="25" y="78" width="185" height="80" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb" stroke-width="1.6"/>
<text x="117.5" y="110.58999999999999" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="19" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="117.5" dy="0">查询 q = [1, 1]</tspan>
<tspan x="117.5" dy="27.55">dₖ = 2</tspan>
</text>
<rect x="267" y="78" width="235" height="145" rx="12" fill="#0f8b8d" fill-opacity=".07" stroke="#0f8b8d" stroke-width="1.6"/>
<text x="384.5" y="117.56" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="384.5" dy="0">K（供匹配）</tspan>
<tspan x="384.5" dy="26.099999999999998">k₁=[1,1]</tspan>
<tspan x="384.5" dy="26.099999999999998">k₂=[1,−1]</tspan>
<tspan x="384.5" dy="26.099999999999998">k₃=[−1,−1]</tspan>
</text>
<rect x="562" y="78" width="235" height="145" rx="12" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="1.6"/>
<text x="679.5" y="117.56" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="679.5" dy="0">V（供读取）</tspan>
<tspan x="679.5" dy="26.099999999999998">v₁=[2,0]</tspan>
<tspan x="679.5" dy="26.099999999999998">v₂=[0,4]</tspan>
<tspan x="679.5" dy="26.099999999999998">v₃=[10,10]</tspan>
</text>
<path d="M210,118 L267,118" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="25" y="280" width="280" height="78" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb" stroke-width="1.6"/>
<text x="165.0" y="311.98" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="165.0" dy="0">qKᵀ / √2</tspan>
<tspan x="165.0" dy="26.099999999999998">[1.4142, 0, −1.4142]</tspan>
</text>
<rect x="370" y="280" width="345" height="78" rx="12" fill="#0f8b8d" fill-opacity=".07" stroke="#0f8b8d" stroke-width="1.6"/>
<text x="542.5" y="311.98" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="542.5" dy="0">逐行 softmax</tspan>
<tspan x="542.5" dy="26.099999999999998">[0.7679, 0.1867, 0.0454]</tspan>
</text>
<rect x="780" y="280" width="305" height="78" rx="12" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="1.6"/>
<text x="932.5" y="311.98" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="932.5" dy="0">乘 V：加权求和</tspan>
<tspan x="932.5" dy="26.099999999999998">输出 ≈ [1.9897, 1.2007]</tspan>
</text>
<path d="M305,319 L370,319" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M715,319 L780,319" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="30" y="414" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="20" fill="#c86c15" text-anchor="start" font-weight="700">
<tspan x="30" dy="0">给第 3 个位置加 mask：其 logit 设为 −∞</tspan>
</text>
<rect x="30" y="439" width="455" height="80" rx="12" fill="#c86c15" fill-opacity=".07" stroke="#c86c15" stroke-width="1.6"/>
<text x="257.5" y="471.98" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="257.5" dy="0">softmax([1.4142, 0, −∞])</tspan>
<tspan x="257.5" dy="26.099999999999998">≈ [0.8044, 0.1956, 0]</tspan>
</text>
<path d="M485,479 L581,479" stroke="#53697b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="581" y="439" width="504" height="80" rx="12" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="1.6"/>
<text x="833.0" y="471.98" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="18" fill="#183046" text-anchor="middle" font-weight="400">
<tspan x="833.0" dy="0">仅在可见位置重新分配权重</tspan>
<tspan x="833.0" dy="26.099999999999998">输出 ≈ [1.6089, 0.7823]</tspan>
</text>
<text x="30" y="559" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="16" fill="#53697b" text-anchor="start" font-weight="400">
<tspan x="30" dy="0">教学例子：维度刻意缩小。真实模型的 Q/K/V 来自可学习投影，权重随样本与层数变化。</tspan>
</text>
</svg>