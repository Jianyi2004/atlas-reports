<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b7181"/></marker></defs><rect width="1200" height="585" fill="white"/><text x="35" y="43" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#203a4d">工作区已有 TouchWAM V1：触觉作为动作条件</text><text x="35" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607888">已核对源码；V1 没有未来触觉预测流。</text><rect x="35" y="115" width="360" height="130" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="51" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">真实触觉历史</text><text x="51" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">4 帧 × 10 指 × 2 通道</text><text x="51" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">32×32 接触保留预处理</text><rect x="445" y="115" width="340" height="130" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="461" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">历史编码器</text><text x="461" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">共享 CNN + 身份 embedding</text><text x="461" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">两层因果 Transformer</text><rect x="835" y="115" width="330" height="130" rx="12" fill="#078583" fill-opacity=".06" stroke="#078583" stroke-width="1.7"/><text x="851" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#078583">40 个条件 token</text><text x="851" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">256 维后投影到 context 宽度</text><text x="851" y="209" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">带 valid mask</text><path d="M395,180 L445,180" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M785,180 L835,180" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="120" y="355" width="350" height="135" rx="12" fill="#2675ad" fill-opacity=".06" stroke="#2675ad" stroke-width="1.7"/><text x="136" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2675ad">视频 DiT</text><text x="136" y="421" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">Wan2.2-5B</text><text x="136" y="449" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">未来视频 latent 去噪</text><rect x="665" y="355" width="390" height="135" rx="12" fill="#b96824" fill-opacity=".06" stroke="#b96824" stroke-width="1.7"/><text x="681" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#b96824">ActionDiT</text><text x="681" y="421" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">原有动作去噪 + 触觉条件残差</text><text x="681" y="449" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#203a4d">默认每五层注入一次</text><path d="M995,247 L995,355" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M470,400 L665,400" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M665,446 L470,446" stroke="#5b7181" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="555" y="382" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#203a4d">联合注意力</text><text x="35" y="550" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#203a4d">新增的是观测条件路径；要成为显式触觉预测模型，还需未来 target、预测头和预测评测。</text></svg>