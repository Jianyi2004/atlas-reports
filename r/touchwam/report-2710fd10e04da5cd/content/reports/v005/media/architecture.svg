<text x="71" y="1006" class="body">VAE decoder remains frozen</text>
<rect x="510" y="902" width="420" height="123" rx="10" fill="#f1edfb" stroke="#ab94cf" stroke-width="1.4"/>
<text x="526" y="931" class="label">Action velocity / generated actions</text>
<text x="526" y="958" class="body">Original masked action objective</text>
<text x="526" y="982" class="body">Inference: generate 32, execute 16</text>
<text x="526" y="1006" class="body">EEF → IK + joint limits → simulator</text>
<path d="M260 857V899" class="line"/>
<path d="M720 857V899" class="line"/>
<rect x="1020" y="175" width="425" height="126" rx="10" fill="#e3f2e8" stroke="#81b99a" stroke-width="1.4"/>
<text x="1036" y="204" class="label">Current + past fingertip maps</text>
<text x="1036" y="231" class="body">4 frames × 10 fingers × 2 × 32 × 32</text>
<text x="1036" y="255" class="body">Normal-ray distance + contact mask</text>
<text x="1036" y="279" class="body">Separate validity mask · no future touch</text>
<rect x="1020" y="335" width="425" height="100" rx="10" fill="#e3f2e8" stroke="#81b99a" stroke-width="1.4"/>
<text x="1036" y="364" class="label">Shared spatial CNN + identity</text>
<text x="1036" y="391" class="body">Hand / finger / time embeddings</text>
<text x="1036" y="415" class="body">40 fingertip-time tokens × 256</text>
<rect x="1020" y="469" width="425" height="100" rx="10" fill="#e3f2e8" stroke="#81b99a" stroke-width="1.4"/>
<text x="1036" y="498" class="label">Causal temporal encoder</text>
<text x="1036" y="525" class="body">2 Transformer layers · 8 heads</text>
<text x="1036" y="549" class="body">LayerNorm + Linear: 256 → 1024</text>
<rect x="1020" y="603" width="425" height="126" rx="10" fill="#e3f2e8" stroke="#81b99a" stroke-width="1.4"/>
<text x="1036" y="632" class="label">Tactile attention in 6 action layers</text>
<text x="1036" y="659" class="body">Layers 5, 10, 15, 20, 25, 30</text>
<text x="1036" y="683" class="body">Reuse original Q/K/V/O projections</text>
<text x="1036" y="707" class="body">Add tactile K/V LoRA · rank 16</text>
<rect x="1020" y="763" width="425" height="112" rx="10" fill="#d3eadc" stroke="#5c9e7a" stroke-width="1.4"/>
<text x="1036" y="792" class="label">Zero-initialized scalar gate</text>
<text x="1036" y="819" class="body">tanh(g) × tactile attention output</text>
<text x="1036" y="843" class="body">Separate softmax + valid-token mask</text>
